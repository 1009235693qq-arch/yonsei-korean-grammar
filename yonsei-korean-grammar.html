// ===========================================
// PRONUNCIATION: Web Speech API
// ===========================================
let currentUtterance = null;
function speakWord(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    u.rate = 0.85;
    currentUtterance = u;
    window.speechSynthesis.speak(u);
    return true;
  }
  return false;
}
function playBtn(btn, text) {
  const allBtns = document.querySelectorAll('.speaker-btn.playing');
  allBtns.forEach(b => b.classList.remove('playing'));
  btn.classList.add('playing');
  const ok = speakWord(text);
  if (ok) {
    setTimeout(() => btn.classList.remove('playing'), 1500);
  } else {
    btn.classList.remove('playing');
  }
}

// ===========================================
// NAVIGATION
// ===========================================
function showUnit(id) {
  document.querySelectorAll('.unit').forEach(u => u.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  const unit = document.getElementById(id);
  if (unit) unit.classList.add('active');
  const btn = document.querySelector(`.nav button[onclick="showUnit('${id}')"]`);
  if (btn) btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===========================================
// RENDER ENGINE
// ===========================================
function renderAll() {
  const container = document.getElementById('content');
  let html = '';
  
  for (const [unitId, data] of Object.entries(lessonData)) {
    html += `<div class="unit${unitId==='unit1'?' active':''}" id="${unitId}">`;
    html += `<div class="unit-header">`;
    html += `<img src="${data.illust}" alt="${data.title}" onerror="this.style.display='none'">`;
    html += `<h2>${data.title}</h2>`;
    html += `<div class="ko-title">${data.koTitle}</div>`;
    html += `</div>`;
    
    // Sections
    data.sections.forEach((sec, si) => {
      const secNum = si + 1;
      html += `<div class="section">`;
      html += `<div class="section-header">`;
      html += `<div class="section-num">${sec.num}</div>`;
      html += `<div class="section-title">${sec.title}</div>`;
      html += `<div class="section-task">${sec.task}</div>`;
      html += `</div>`;
      
      // Grammar
      html += `<div class="grammar-block">`;
      html += `<h4>📖 语法</h4>`;
      sec.grammar.forEach(g => {
        html += `<div class="grammar-item">`;
        html += `<div class="grammar-point">${g.point}</div>`;
        html += `<div class="grammar-explain">${g.explain}</div>`;
        html += `<ul class="grammar-examples">`;
        g.examples.forEach(ex => {
          html += `<li><button class="speaker-btn" onclick="playBtn(this,'${ex.replace(/'/g,"\'")}')">🔊</button><span>${ex}</span></li>`;
        });
        html += `</ul></div>`;
      });
      html += `</div>`;
      
      // Dialogue
      html += `<div class="dialogue-block">`;
      html += `<h4>💬 课文 <a href="${data.bilibili[String(secNum)] || '#'}" target="_blank" class="bilibili-link">🎧 B站课文朗读</a></h4>`;
      sec.dialogue.forEach(d => {
        html += `<div class="dialogue-line">`;
        html += `<span class="dialogue-speaker">${d.speaker}</span>`;
        html += `<span class="dialogue-text">${d.text}</span>`;
        html += `<button class="speaker-btn" onclick="playBtn(this,'${d.text.replace(/'/g,"\'")}')">🔊</button>`;
        html += `</div>`;
      });
      html += `</div>`;
      
      // Mini vocab
      html += `<div class="vocab-mini">`;
      html += `<h4>📝 本小节重点单词</h4>`;
      html += `<div class="vocab-mini-grid">`;
      sec.vocab.forEach(v => {
        html += `<div class="vocab-mini-item">`;
        html += `<span class="ko" style="color:var(--green);font-weight:600;">${v.ko}</span>`;
        html += `<span class="zh" style="color:var(--muted);font-size:0.78rem;">${v.zh}</span>`;
        html += `<button class="speaker-btn" onclick="playBtn(this,'${v.ko.replace(/'/g,"\'")}')" style="width:22px;height:22px;font-size:0.65rem;">🔊</button>`;
        html += `</div>`;
      });
      html += `</div></div>`;
      html += `</div>`; // close section
    });
    
    // Full vocabulary
    html += `<div class="vocab-full">`;
    html += `<h3>📚 ${data.title} 全部词汇总览</h3>`;
    html += `<div class="vocab-grid">`;
    data.allVocab.forEach(v => {
      html += `<div class="vocab-item">`;
      html += `<button class="speaker-btn" onclick="playBtn(this,'${v.ko.replace(/'/g,"\'")}')" style="width:22px;height:22px;font-size:0.65rem;">🔊</button>`;
      html += `<span class="ko">${v.ko}</span>`;
      html += `<span class="zh">${v.zh}</span>`;
      html += `</div>`;
    });
    html += `</div></div>`;
    
    html += `</div>`; // close unit
  }
  
  container.innerHTML = html;
}

// Initialize
renderAll();
</script>
